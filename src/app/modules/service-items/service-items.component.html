<!-- modules/service-items/service-items.component.html -->
<div class="header-bar">
  <h2 class="header-title">
    Service Items {{ applicationName ? '- ' + applicationName : '' }}
  </h2>
  <button kendoButton themeColor="primary" (click)="onCreateNew()">
    Create New Service Item
  </button>
</div>

<div class="p-md bg-white border-light rounded mb-md shadow-sm">
  <div class="flex-row gap-md">
    <div class="flex-1">
      <label class="filter-label mb-xs block">Filter by Application</label>
      <kendo-dropdownlist [data]="applications" [textField]="'title'" [valueField]="'id'" [valuePrimitive]="true"
        [defaultItem]="defaultAppItem" [ngModel]="applicationId" (ngModelChange)="onApplicationChange($event)"
        class="w-full">
      </kendo-dropdownlist>
    </div>

    <div class="flex-1">
      <label class="filter-label mb-xs block">Select Process Type {{ applicationName ? 'for ' + applicationName : ''
        }}</label>
      <app-process-definition-select [applicationId]="applicationId"
        [initialProcessDefinitionId]="selectedProcessDefinitionId"
        (processDefinitionSelected)="onProcessDefinitionSelected($event)">
      </app-process-definition-select>
    </div>
  </div>
</div>

@if (selectedProcessDefinitionId) {
<div>
  <app-service-item-table [selectedProcessDefinitionId]="selectedProcessDefinitionId" [applicationId]="applicationId">
  </app-service-item-table>
</div>
} @else {
<div class="p-xl bg-white border-light rounded text-center shadow-sm" style="margin-top: 40px;">
  <span class="material-icons mb-sm" style="font-size: 48px; color: #cbd5e1;">fact_check</span>
  <h3 class="text-muted" style="margin-top: 0;">No Process Selected</h3>
  <p class="text-muted">Please select an Application and Process Type from the menu above to map the service layouts...
  </p>
</div>
}
